        background-image: url(https://obmontessori.orangeapps.ph/landing/obmontessori/images/FV%20Facade.jpg);
        background-repeat: no-repeat;
        background-size: cover;
      }

        #info{
        background-color: rgba(255, 254, 253, 0.852);
        color: rgb(22, 21, 21);
        border-radius: 5px;
        box-shadow: 5px 5px 10px 1px rgba(28, 23, 73, 0.424);
        padding: 5px ;
        font-family: Verdana;
        margin-top: 5px;
      }

        .mycontactform{
        background-color:rgba(242, 242, 242, 0.615);
        border-radius: 10px;
        padding: 10px;
        font-family: Verdana;
        color:rgba(1, 1, 9, 0.74);
        box-shadow: 5px 5px 10px 1px rgba(17, 14, 37, 0.424);
        width: 60%;
        margin-left: 18%;

      }

    </style>
</head>
<body>

        <nav class="navbar navbar-expand-lg navbar-dark bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhGWMliic2yX4A8KaM5AP99wxYDDubpMTUsDhyHWKdYmoUUNZZYomypEc&s=10" alt="obmclogo" class="rounded-circle" style="height: 40px; width: 40px;"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mynavbar">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">

        <li class="nav-item">
          <a class="nav-link text-dark" href="#section2">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark" href="#section3">Contact Us</a>
        </li>
      </ul>
      <form class="d-flex">
        <input class="form-control me-2" type="text" placeholder="Search">
        <button class="btn btn-dark" type="button">Search</button>
      </form>

  </div>

  <br>

          <div class="mycontactform">
         <form>
            <div>
                <label for="name">Full Name</label>
                <br>
                <input style="font-family: Verdana;" size="40" type="text" id="name" required placeholder="Enter your full name">
            </div>
            <div>
                <label for="email">Your Email</label>
                <br>
                <input style="font-family: Verdana;" size="40" type="email" id="email" required placeholder="Enter your email">
            </div>
            <div>
                <label for="email">Subject</label>
                <br>
                <input style="font-family: Verdana;" size="40" type="subject" id="subject" required placeholder="Enter subject">
            </div>



                <div style="align-items: center; gap: 10px;">
                <label style="margin-bottom: 0; margin-right: 5px;" for="feedback">Message</label>
                <br>
                <textarea id="feedback" rows="6" cols="41" placeholder="Type your message here..." style="font-family: Verdana;"></textarea>
                </div>

                <button type="submit" style="background-color:rgb(11, 134, 164); width: 36%; padding: 12px; font-size: 16px; margin-top: 10px; color:rgb(242, 242, 242); font-family: Verdana; border-radius: 20px; border-style:hidden;">Submit</button>
                </div>

            </div>
        </div>
    </div>
